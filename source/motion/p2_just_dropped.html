<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><link rel="stylesheet" href="post.css">
<style>
.l44{font-size:44px;font-weight:300}
.b110{font-size:112px;font-weight:700;letter-spacing:-0.025em;line-height:1.02}
</style></head><body>
<section class="sc white" id="s" style="display:block">
  <div class="t" style="top:200px"><span class="ln l44">Fresh in store.</span></div>
  <div class="t" style="top:270px"><span class="ln b110">Something new</span><span class="ln b110 or">just dropped.</span></div>
  <svg id="art" width="1080" height="1350" style="position:absolute;left:0;top:0;z-index:4" font-family="Poppins">
    <g id="spk"></g>
    <ellipse id="shadow" cx="420" cy="1200" rx="230" ry="26" fill="#F5F5F7"/>
    <g id="bag">
      <path d="M-100,8 C-100,-170 100,-170 100,8" fill="none" stroke="#1D1D1F" stroke-width="18" stroke-linecap="round"/>
      <rect x="-200" y="0" width="400" height="400" rx="34" fill="#F27C10"/>
      <rect x="-200" y="0" width="400" height="58" rx="28" fill="#F58A28"/>
      <circle cx="-100" cy="30" r="12" fill="#1D1D1F"/><circle cx="100" cy="30" r="12" fill="#1D1D1F"/>
      <image href="a/logo_white.png" x="-130" y="170" width="260" height="104"/>
      <g id="tags"></g>
    </g>
  </svg>
  <div class="pill" style="top:1210px;transform:translateX(-50%);font-size:30px;padding:18px 38px">New roles weekly. Link in bio.</div>
</section>
<script src="lib.js"></script><script src="post.js"></script>
<script>
window.DURATION = 8;
const TAGS = ['Store Manager', 'Area Manager', 'Visual Merch'];
function setup() {
  
  $('#tags').innerHTML = TAGS.map((n, i) => `<g id="tg${i}">
    <line x1="150" y1="-40" x2="${300}" y2="${60 + i * 120}" stroke="#1D1D1F" stroke-width="3"/>
    <g transform="translate(300,${60 + i * 120})">
      <path d="M0,0 L34,-40 H330 Q350,-40 350,-20 V20 Q350,40 330,40 H34 Z" fill="#fff" stroke="#1D1D1F" stroke-width="3"/>
      <circle cx="30" cy="0" r="9" fill="#fff" stroke="#1D1D1F" stroke-width="3"/>
      <text x="58" y="11" font-size="31" font-weight="600" fill="#1D1D1F">${n}</text>
    </g></g>`).join('');
  $('#spk').innerHTML = [[860,560,1],[180,560,.7],[930,1050,.8],[120,980,.6]].map((s, i) => `<path id="sp${i}" d="M0,-30 C4,-6 6,-4 30,0 C6,4 4,6 0,30 C-4,6 -6,4 -30,0 C-6,-4 -4,-6 0,-30 Z" fill="#F27C10" data-x="${s[0]}" data-y="${s[1]}" data-s="${s[2]}"/>`).join('');
}
function render(t) {
  moveLoop($('#s'), t);
  const sway = 4 * osc(t, 1), bob = 10 * osc(t, 2, 1);
  $('#bag').setAttribute('transform', `translate(400,${720 + bob}) rotate(${sway})`);
  TAGS.forEach((_, i) => $('#tg' + i).setAttribute('transform', `rotate(${7 * osc(t, 2, i * 1.3) - sway * .6}, 150, -40)`));
  $('#shadow').setAttribute('rx', 230 - 12 * osc(t, 2, 1));
  $$('#spk path').forEach((p, i) => { const k = p.dataset.s * (.55 + .45 * Math.abs(osc(t, 2, i * .9))); p.setAttribute('transform', `translate(${p.dataset.x},${p.dataset.y}) scale(${k}) rotate(${45 * osc(t, 1, i)})`); });
}
</script></body></html>
