<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><link rel="stylesheet" href="post.css">
<!--
  RETAILWORLD GOOGLE REVIEW STATIC POST TEMPLATE ("They said it. Not us.")
  1080 x 1350 PNG, no logo (single post rule). Edit the REVIEW block, then render:
    STILL_ONLY=1 python3 render_post.py review_static.html out.mp4   (writes out.png)
  Rules: never put the reviewer's name in. Wrap one phrase in {curly braces} to highlight it.
-->
<style>
.b150{font-size:150px;font-weight:700;letter-spacing:-0.045em;line-height:.96}
#card{position:absolute;left:90px;right:90px;top:560px;background:#fff;border:1px solid #fff;border-radius:52px;box-shadow:0 40px 100px rgba(120,50,0,.22);padding:56px 60px 54px;color:#1D1D1F;z-index:5;transform:rotate(-1.5deg)}
.who{display:flex;align-items:center;gap:22px}
.avt{width:92px;height:92px;border-radius:50%;background:#F27C10;display:flex;align-items:center;justify-content:center;flex:none}
.stars{display:flex;gap:10px;margin-left:auto}
.stars svg{width:44px;height:44px}
#hook{font-size:62px;font-weight:600;letter-spacing:-0.025em;line-height:1.12;margin:44px 0 26px}
#hook .hl{background-image:linear-gradient(#F27C10,#F27C10);background-repeat:no-repeat;background-position:0 90%;background-size:100% 34%}
#sub{font-size:36px;font-weight:300;line-height:1.45;color:#1D1D1F}
#foot{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:32px;font-weight:500;color:#fff;z-index:5}
</style></head><body>
<section class="sc orange" id="s" style="display:block">
  <div class="t" style="top:150px"><span class="ln b150">They said it.</span><span class="ln b150">Not us.</span></div>
  <div id="card">
    <div class="who"><div class="avt"><svg width="52" height="52" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3,22 C3,15.5 21,15.5 21,22 Z"/></svg></div>
      <div><div style="font-size:36px;font-weight:600;line-height:1.15">Google review</div><div style="font-size:28px;color:#6E6E73" id="about"></div></div>
      <div class="stars" id="stars"></div></div>
    <div id="hook"></div>
    <div id="sub"></div>
  </div>
  <div id="foot"></div>
</section>
<script src="lib.js"></script><script src="post.js"></script>
<script>
// ===================== EDIT ME =====================
const REVIEW = {
  recruiter: 'Dean',                                        // "About Dean". Never the reviewer's name.
  hook: '“{Dean was absolutely my hype man.}”',             // the big line, 12 words max
  sub: '“He had great advice, friendly service and 10/10 communication.”', // supporting line, 25 words max
  foot: 'Real reviews from real candidates.'                // small line at the bottom
};
// ===================================================
window.DURATION = 8;
function setup() {
  const st = '<svg viewBox="0 0 24 24"><path d="M12,2 L15,9 L22,9.5 L16.5,14 L18.5,21 L12,17 L5.5,21 L7.5,14 L2,9.5 L9,9 Z" fill="#F27C10"/></svg>';
  $('#stars').innerHTML = st.repeat(5);
  $('#about').textContent = 'About ' + REVIEW.recruiter;
  $('#hook').innerHTML = REVIEW.hook.replace(/\{([^}]+)\}/g, '<span class="hl">$1</span>');
  $('#sub').textContent = REVIEW.sub;
  $('#foot').textContent = REVIEW.foot;
  loopCircles($('#s'), [[70,500,170,'ring:#FFFFFF',0,1,1,0],[110,1250,420,'#F58A28',0,1,1,0],[980,1210,120,'#FFFFFF',0,1,1,0]]);
}
function render(t) { moveLoop($('#s'), t); }
</script></body></html>
