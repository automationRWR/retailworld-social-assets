<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><link rel="stylesheet" href="post.css">
<style>
.b110{font-size:116px;font-weight:700;letter-spacing:-0.025em;line-height:1.02}
#cv{position:absolute;left:250px;top:520px;width:580px;height:620px;background:#fff;border-radius:44px;box-shadow:0 36px 80px rgba(0,0,0,.14);z-index:4;padding:50px}
.bar{height:22px;border-radius:11px;background:#F5F5F7;margin-bottom:18px}
#laser{position:absolute;left:-30px;right:-30px;height:10px;border-radius:5px;background:#F27C10;z-index:6}
#band{position:absolute;left:-30px;right:-30px;height:90px;background:rgba(242,124,16,.14);z-index:5}
#match{position:absolute;right:-50px;top:-36px;background:#F27C10;color:#fff;font-size:34px;font-weight:700;letter-spacing:.06em;padding:12px 30px;border-radius:999px;z-index:7;box-shadow:0 14px 30px rgba(242,124,16,.35)}
</style></head><body>
<section class="sc white" id="s" style="display:block">
  <div class="t" style="top:190px"><span class="ln b110">Scanned.</span><span class="ln b110 or">Matched.</span></div>
  <div id="cv">
    <div style="display:flex;gap:26px;align-items:center;margin-bottom:34px">
      <div style="width:120px;height:120px;border-radius:50%;background:#F27C10;display:flex;align-items:center;justify-content:center"><svg width="70" height="70" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3,22 C3,15.5 21,15.5 21,22 Z"/></svg></div>
      <div style="flex:1"><div style="font-size:36px;font-weight:600">Your CV</div><div style="font-size:24px;color:#6E6E73;font-weight:400">Retail. Ready.</div></div>
    </div>
    <div class="bar" style="width:100%"></div><div class="bar" style="width:86%"></div><div class="bar" style="width:92%"></div><div class="bar" style="width:64%"></div>
    <div style="position:absolute;left:50px;right:50px;bottom:50px">
      <svg width="480" height="120" id="bc"></svg>
      <div style="font-size:22px;letter-spacing:.3em;color:#6E6E73;text-align:center;margin-top:8px">RW · 2026 · AU NZ</div>
      <div id="band"></div><div id="laser"></div><div id="match">MATCH</div>
    </div>
  </div>
  <div class="t lbl" style="top:1205px;font-size:38px">Your CV, at the right checkout.</div>
</section>
<script src="lib.js"></script><script src="post.js"></script>
<script>
window.DURATION = 8;
function setup() {
  
  let x = 0, bars = ''; let seed = 11;
  while (x < 470) { seed = (seed * 9301 + 49297) % 233280; const w = 4 + (seed % 4) * 4; bars += `<rect x="${x}" y="0" width="${w}" height="120" fill="#1D1D1F"/>`; x += w + 5 + (seed % 3) * 3; }
  $('#bc').innerHTML = bars;
}
function render(t) {
  moveLoop($('#s'), t);
  $('#cv').style.transform = `translateY(${10 * osc(t, 1)}px) rotate(${-4 + 1.5 * osc(t, 1, 1)}deg)`;
  const ph = (t % 2) / 2, y = -10 + 130 * (.5 - .5 * Math.cos(ph * TAU));
  $('#laser').style.top = y + 'px'; $('#band').style.top = (y - 40) + 'px';
  const beat = ph < .5 ? ph / .5 : (ph - .5) / .5; const pk = E.back(cl(beat * 2.2));
  $('#match').style.transform = `scale(${ph < .5 ? pk : 1 - .08 * Math.sin(beat * Math.PI)}) rotate(6deg)`;
  $('#match').style.opacity = ph < .5 ? cl(beat * 4) : 1;
}
</script></body></html>
