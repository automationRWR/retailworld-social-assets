<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><link rel="stylesheet" href="post.css">
<style>
.screen{position:absolute;inset:0;background:#F5F5F7}

</style></head><body>
<section class="sc orange" id="s" style="display:block">
  <div class="t" style="top:165px;font-size:40px;font-weight:300">You said you're just looking.</div>
  <div class="t" style="top:225px;font-size:104px;font-weight:700;letter-spacing:-0.025em;line-height:1">Four minutes later.</div>
  <div class="phone" id="ph" style="left:240px;top:430px"><div class="screen"></div><div class="notch"></div>
    <div style="position:absolute;left:0;right:0;top:110px;text-align:center;font-size:150px;font-weight:300;line-height:1;letter-spacing:-0.02em">9:41</div>
    <div style="position:absolute;left:0;right:0;top:270px;text-align:center;font-size:28px;font-weight:500;color:#6E6E73">Monday 12 October</div>
    <div class="ntf" id="n1" style="top:360px"><div class="ic"><img src="a/logo_white.png"></div><div style="flex:1"><div class="h">Retailworld<span>now</span></div><div class="b">New role: Store Manager</div><div class="s">Fashion retail. Matches you.</div></div></div>
    <div class="ntf" id="n2" style="top:550px"><div class="ic"><img src="a/logo_white.png"></div><div style="flex:1"><div class="h">Retailworld<span>now</span></div><div class="b">New role: Area Manager</div><div class="s">Multi-site. Interview Wednesday?</div></div></div>
    <div class="ntf" id="n3" style="top:740px"><div class="ic"><img src="a/logo_white.png"></div><div style="flex:1"><div class="h">Retailworld<span>now</span></div><div class="b">You've got 3 interviews</div><div class="s">Tap to see your week.</div></div></div>
  </div>
</section>
<script src="lib.js"></script><script src="post.js"></script>
<script>
window.DURATION = 8;
function render(t) {
  $('#ph').style.transform = `translateY(${8 * osc(t, 1)}px) rotate(${-.8 * osc(t, 1, 1)}deg)`;
  const out = 1 - P(t, 7.2, .6);
  ['#n1','#n2','#n3'].forEach((id, i) => {
    const p = P(t, .5 + i * .8, .7), k = E.back(p);
    $(id).style.opacity = cl(p * 3) * out; $(id).style.transform = `translateY(${(1 - k) * -120}px) scale(${.85 + .15 * k})`;
  });
}
</script></body></html>
