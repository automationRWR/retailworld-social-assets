<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css">
<style>
.b220{font-size:220px;font-weight:700;letter-spacing:-0.03em;line-height:1}
.m90{font-size:90px;font-weight:500;color:#6E6E73;letter-spacing:-0.01em}
.b160{font-size:160px;font-weight:700;letter-spacing:-0.025em;line-height:1}
.l60{font-size:60px;font-weight:300}
.screen{position:absolute;inset:0;background:#fff}
.hdr{position:absolute;left:0;right:0;top:80px;height:170px;border-bottom:1px solid #E5E5EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.av{width:84px;height:84px;border-radius:50%;background:#E5E5EA;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:600;color:#6E6E73}
.bub{position:absolute;right:28px;max-width:440px;background:#F27C10;color:#fff;font-size:30px;font-weight:500;line-height:1.3;padding:20px 28px;border-radius:36px 36px 10px 36px;transform-origin:100% 100%}
.read{position:absolute;right:34px;font-size:22px;color:#6E6E73;font-weight:500}
.typing{position:absolute;right:28px;width:130px;height:66px;border-radius:33px;background:#F27C10;display:flex;align-items:center;justify-content:center;gap:12px}
.typing i{width:14px;height:14px;border-radius:50%;background:#fff;display:block}
.warn{position:absolute;left:90px;right:90px;top:1460px;background:#fff;border-radius:40px;padding:30px 34px;display:flex;gap:24px;align-items:center;box-shadow:0 30px 70px rgba(0,0,0,.14);z-index:7}
.warn .ic{width:96px;height:96px;border-radius:26px;background:#F27C10;color:#fff;font-size:60px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body>
<section class="sc white" id="s1"><img class="logo" src="a/logo.png">
  <div class="phone" id="ph" style="left:240px;top:360px"><div class="screen"></div><div class="notch"></div><div class="time">9:41</div>
    <div class="hdr"><div class="av">S</div><div style="font-size:26px;font-weight:600">Sarah</div></div>
    <div class="bub" id="b1" style="top:300px">Hey Sarah! Found you a Store Manager role.</div>
    <div class="bub" id="b2" style="top:470px">Sarah?</div>
    <div class="bub" id="b3" style="top:580px">Interview is Thursday!</div>
    <div class="bub" id="b4" style="top:690px">Hello??</div>
    <div class="read" id="rd" style="top:792px">Read 9:41am</div>
    <div class="typing" id="ty" style="top:850px"><i></i><i></i><i></i></div>
  </div>
</section>
<section class="sc white" id="s2"><img class="logo" src="a/logo.png">
  <div class="t" style="top:520px" id="t2" data-text="[b220]Sarah.|[m90]You never|[m90]replied."></div>
  <div class="warn" id="wn"><div class="ic">!</div><div><div style="font-size:30px;font-weight:600">Retailworld <span style="font-weight:400;color:#6E6E73;font-size:26px">now</span></div><div style="font-size:36px;font-weight:600">Final warning.</div><div style="font-size:28px;color:#6E6E73">We've been trying to reach you.</div></div></div>
</section>
<section class="sc orange" id="s3"><img class="logo" src="a/logo_white.png">
  <div class="t lbl" style="top:470px;font-size:46px" id="t3a" data-text="Okay. We'll come clean."></div>
  <div class="t" style="top:600px" id="t3" data-text="[b160]There is|[b160]no Sarah."></div>
</section>
<section class="sc white" id="s4"><img class="logo" src="a/logo.png">
  <div class="t" style="top:560px" id="t4a" data-text="[l60]But the roles"></div>
  <div class="t" style="top:670px" id="t4" data-text="[b220 or]are real."></div>
  <div class="t lbl" style="top:1120px" id="t4b" data-text="And one of them is yours."></div>
  <div class="pill" id="cta" style="top:1360px">Comment DRAMA</div>
</section>
<script>window.NO_CIRCLES = true;</script>
<script src="lib.js"></script>
<script>
window.DURATION = 13.5;
function setup() {
  circles($('#s1'), [[900,330,300,'#F27C10',.55,60,0],[140,1620,520,'#F5F5F7',.35,80,1],[980,1700,170,'ring:#F27C10',.8,50,2],[120,330,90,'#F27C10',1,40,3]]);
  circles($('#s2'), [[150,330,260,'ring:#F27C10',.6,50,1],[950,1050,440,'#F5F5F7',.4,70,2],[920,300,100,'#F27C10',1,40,0],[140,1250,70,'ring:#1D1D1F',1.3,30,2]]);
  circles($('#s3'), [[900,420,380,'ring:#FFFFFF',.5,60,0],[140,1580,600,'#F58A28',.35,70,1],[960,1600,150,'#FFFFFF',.9,40,2],[120,500,90,'ring:#FFFFFF',1.1,40,3]]);
  circles($('#s4'), [[880,420,320,'#F27C10',.55,60,0],[160,1560,500,'#F5F5F7',.35,80,1],[950,1620,170,'ring:#F27C10',.8,50,2],[140,380,80,'ring:#1D1D1F',1.2,30,1]]);
}
function render(t) {
  $$('.sc').forEach(s => moveCircles(s, t));
  if (scene($('#s1'), t, 0, 4.8)) {
    const k = E.o5(P(t, 0, 1));
    $('#ph').style.transform = `translateY(${(1 - k) * 1300 + Math.sin(t * 1.5) * 10}px) rotate(${(1 - k) * 8 + Math.sin(t) * 1}deg) scale(${1 + .05 * E.io(P(t, 3.6, 1.2))})`;
    ['#b1','#b2','#b3','#b4'].forEach((id, i) => { const p = P(t, .7 + i * .65, .5); $(id).style.opacity = cl(p * 3); $(id).style.transform = `scale(${E.back(p)})`; });
    $('#rd').style.opacity = cl(P(t, 3.3, .3));
    $('#ty').style.opacity = cl(P(t, 3.5, .2));
    $$('#ty i').forEach((d, i) => d.style.transform = `translateY(${-10 * Math.max(0, Math.sin(t * 9 - i * .8))}px)`);
  }
  if (scene($('#s2'), t, 4.4, 8.2, { x: 540, y: 960 })) {
    words($('#t2'), t, 4.8, { type: 'drop', st: .14, d: .9 });
    const p = P(t, 6.2, .6);
    const sh = t > 6.8 && t < 7.6 ? Math.sin(t * 60) * 18 * (1 - P(t, 6.8, .8)) : 0;
    $('#wn').style.opacity = cl(p * 3); $('#wn').style.transform = `translateY(${(1 - E.back(p)) * 300}px) translateX(${sh}px) rotate(${sh * .08}deg)`;
  }
  if (scene($('#s3'), t, 7.8, 10.9, { x: 900, y: 1500 })) {
    words($('#t3a'), t, 8.2, { st: .05 });
    words($('#t3'), t, 8.6, { type: 'rise', st: .12, d: .7 });
  }
  if (scene($('#s4'), t, 10.5, 13.5, { x: 200, y: 300 })) {
    words($('#t4a'), t, 10.9, { st: .07 });
    words($('#t4'), t, 11.2, { type: 'pop', st: .15 });
    words($('#t4b'), t, 11.9, { type: 'blur', st: .05 });
    pop($('#cta'), t, 12.4, { base: 'translateX(-50%)' });
  }
}
</script></body></html>
