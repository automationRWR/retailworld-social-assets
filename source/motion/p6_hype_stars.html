<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"><link rel="stylesheet" href="post.css">
<style>
.b108{font-size:108px;font-weight:700;letter-spacing:-0.025em;line-height:1.04}
#stars{position:absolute;left:0;right:0;top:300px;display:flex;justify-content:center;gap:22px;z-index:5}
#stars svg{width:96px;height:96px}
</style></head><body>
<section class="sc orange" id="s" style="display:block">
  <div id="stars"></div>
  <div class="t" style="top:470px"><span class="ln b108">“Dean was</span><span class="ln b108">absolutely my</span><span class="ln b108">hype man.”</span></div>
  <div class="t lbl" style="top:880px;font-size:40px">A real Google review.</div>
  <div class="pill" style="top:1090px;transform:translateX(-50%);font-size:32px">Get someone in your corner.</div>
</section>
<script src="lib.js"></script><script src="post.js"></script>
<script>
window.DURATION = 8;
function setup() {
  
  const st = '<svg viewBox="0 0 24 24"><path d="M12,2 L15,9 L22,9.5 L16.5,14 L18.5,21 L12,17 L5.5,21 L7.5,14 L2,9.5 L9,9 Z" fill="#fff"/></svg>';
  $('#stars').innerHTML = [0,1,2,3,4].map(i => `<span id="st${i}" style="display:inline-block">${st}</span>`).join('');
}
function render(t) {
  moveLoop($('#s'), t);
  for (let i = 0; i < 5; i++) {
    const ph = ((t / 2) - i * .09) % 1, hop = ph > 0 && ph < .3 ? Math.sin(ph / .3 * Math.PI) : 0;
    $('#st' + i).style.transform = `translateY(${-40 * hop}px) rotate(${hop * 18}deg) scale(${1 + .12 * hop})`;
  }
}
</script></body></html>
