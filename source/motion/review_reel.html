<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css">
<!--
  RETAILWORLD GOOGLE REVIEW REEL TEMPLATE ("Ding.")
  1080 x 1920, 14s. Edit the REVIEW block below, then render:
    python3 render.py review_reel.html out.mp4
  Rules: never put the reviewer's name in. Wrap up to one phrase per bubble in {curly braces} to highlight it.
-->
<style>
.l60{font-size:60px;font-weight:300}
.b230{font-size:230px;font-weight:700;letter-spacing:-0.045em;line-height:1}
.b160{font-size:160px;font-weight:700;letter-spacing:-0.035em;line-height:.98}
#phone{left:240px;top:820px;background:#F5F5F7}
#lk-time{position:absolute;left:0;right:0;top:130px;text-align:center;font-size:150px;font-weight:600;letter-spacing:-0.04em;line-height:1}
#lk-date{position:absolute;left:0;right:0;top:100px;text-align:center;font-size:28px;font-weight:500;color:#6E6E73}
#note{position:absolute;left:26px;right:26px;top:340px;background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:40px;box-shadow:0 18px 50px rgba(0,0,0,.10);padding:26px 28px 28px}
.nrow{display:flex;align-items:center;gap:16px}
.nic{width:58px;height:58px;border-radius:15px;background:#F27C10;display:flex;align-items:center;justify-content:center;flex:none}
.napp{font-size:24px;font-weight:600;flex:1}
.nnow{font-size:22px;color:#6E6E73}
.ntitle{font-size:27px;font-weight:600;margin:18px 0 6px}
.nbody{font-size:25px;font-weight:300;line-height:1.4;color:#1D1D1F}
#head{position:absolute;left:80px;right:80px;top:330px;display:flex;align-items:center;gap:26px;z-index:5}
.avt{width:110px;height:110px;border-radius:50%;background:#F27C10;display:flex;align-items:center;justify-content:center;flex:none}
#stars{display:flex;gap:8px;margin-top:10px}
#stars svg{width:42px;height:42px}
#thread{position:absolute;left:80px;right:80px;top:620px;display:flex;flex-direction:column;align-items:flex-start;gap:40px;z-index:5}
.bub{background:#fff;border-radius:48px 48px 48px 14px;padding:36px 46px;font-size:56px;font-weight:400;line-height:1.36;max-width:920px;box-shadow:0 20px 50px rgba(0,0,0,.06);transform-origin:0 100%}
.bub .hl{font-weight:600;background-image:linear-gradient(#F27C10,#F27C10);background-repeat:no-repeat;background-position:0 88%;background-size:0% 38%}
.typing{position:absolute;left:0;bottom:0;background:#fff;border-radius:48px 48px 48px 14px;padding:34px 40px;display:flex;gap:14px;transform-origin:0 100%}
.typing i{width:18px;height:18px;border-radius:50%;background:#6E6E73;display:block}
.slot{position:relative}
</style></head><body>

<!-- SCENE 1: the notification -->
<section class="sc white" id="s1"><img class="logo" src="a/logo.png">
  <div class="t" style="top:330px" id="t1a" data-text="[l60 or]New notification."></div>
  <div class="t" style="top:430px" id="t1" data-text="[b230]Ding."></div>
  <div class="phone" id="phone"><div class="notch"></div>
    <div id="lk-date"></div><div id="lk-time">9:41</div>
    <div id="note">
      <div class="nrow"><div class="nic"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M12,2 L15,9 L22,9.5 L16.5,14 L18.5,21 L12,17 L5.5,21 L7.5,14 L2,9.5 L9,9 Z" fill="#fff"/></svg></div>
        <div class="napp">Google review</div><div class="nnow">now</div></div>
      <div class="ntitle" id="ntitle"></div>
      <div class="nbody" id="nbody"></div>
    </div>
  </div>
</section>

<!-- SCENE 2: the review, as a chat thread -->
<section class="sc white" id="s2" style="background:#F5F5F7">
  <div id="head"><div class="avt"><svg width="60" height="60" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3,22 C3,15.5 21,15.5 21,22 Z"/></svg></div>
    <div><div style="font-size:44px;font-weight:600;line-height:1.1">Google review</div><div style="font-size:32px;color:#6E6E73" id="about"></div><div id="stars"></div></div></div>
  <div id="thread"></div>
</section>

<!-- SCENE 3: the CTA -->
<section class="sc orange" id="s3"><img class="logo" src="a/logo_white.png">
  <div class="t lbl" style="top:500px;font-size:42px" id="t3a"></div>
  <div class="t" style="top:610px" id="t3" data-text="[b160]We'll be|[b160]right here."></div>
  <div class="t lbl" style="top:1000px;font-size:40px" id="t3b" data-text="Store, area and head office roles. AU and NZ."></div>
  <div class="pill" id="cta" style="top:1300px"></div>
</section>

<script src="lib.js"></script>
<script>
// ===================== EDIT ME =====================
const REVIEW = {
  recruiter: 'Dean',                                   // shows as "About Dean". Never the reviewer's name.
  date: 'Tuesday 13 October',                          // lock screen date
  preview: 'Dean was absolutely my hype man through all this...', // notification preview line
  bubbles: [                                           // 2 or 3 short lines from the review, in order
    'I have never worked alongside recruiters who have been better at communicating.',
    '{Dean was absolutely my hype man} through all this.',
    'He had great advice, friendly service and {10/10 communication}.'
  ],
  ctaWord: 'HYPE'                                      // "Comment HYPE"
};
// ===================================================
window.DURATION = 14;
const STAR = c => `<svg viewBox="0 0 24 24"><path d="M12,2 L15,9 L22,9.5 L16.5,14 L18.5,21 L12,17 L5.5,21 L7.5,14 L2,9.5 L9,9 Z" fill="${c}"/></svg>`;
const B0 = 4.4, BGAP = 1.55; // first bubble time, gap between bubbles
function setup() {
  $('#lk-date').textContent = REVIEW.date;
  $('#ntitle').textContent = '★★★★★  About ' + REVIEW.recruiter;
  $('#nbody').textContent = '“' + REVIEW.preview + '”';
  $('#about').textContent = 'About ' + REVIEW.recruiter;
  $('#stars').innerHTML = [0,1,2,3,4].map(i => `<span id="sr${i}" style="display:inline-block;width:42px;height:42px">${STAR('#F27C10')}</span>`).join('');
  $('#thread').innerHTML = REVIEW.bubbles.map((b, i) => {
    const txt = b.replace(/\{([^}]+)\}/g, (m, x) => `<span class="hl" id="hl${i}">${x}</span>`);
    return `<div class="slot"><div class="bub" id="bub${i}">${txt}</div><div class="typing" id="ty${i}"><i></i><i></i><i></i></div></div>`;
  }).join('');
  const a = $('#t3a'); a.setAttribute('data-text', `Want someone like ${REVIEW.recruiter} in your corner?`); split(a);
  $('#cta').textContent = 'Comment ' + REVIEW.ctaWord;
  circles($('#s1'), [[1010,250,200,'#F27C10',.55,40,0],[110,1500,300,'ring:#F27C10',.6,50,1],[1000,1650,150,'#F27C10',.9,40,2]]);
  circles($('#s2'), [[990,240,220,'ring:#F27C10',.5,40,0],[90,1800,320,'#FFFFFF',.4,40,1]]);
  circles($('#s3'), [[940,260,300,'ring:#FFFFFF',.5,40,0],[140,1580,600,'#F58A28',.35,70,1],[960,1640,150,'#FFFFFF',.9,40,2]]);
}
function render(t) {
  $$('.sc').forEach(s => moveCircles(s, t));
  // S1: Ding + notification
  if (scene($('#s1'), t, 0, 4.0)) {
    words($('#t1a'), t, .15, { st: .05 });
    words($('#t1'), t, .35, { type: 'pop', d: .5 });
    rise($('#phone'), t, .5, { dy: 900, d: 1.1 });
    const n = P(t, 1.7, .55), k = E.back(n);
    $('#note').style.opacity = cl(n * 3);
    $('#note').style.transform = `translateY(${(1 - E.o5(n)) * -120}px) scale(${.9 + .1 * k})`;
    // "ding" nudge on the phone
    const d = P(t, 1.7, .6); $('#phone').style.transform += ` rotate(${Math.sin(d * Math.PI * 4) * (1 - d) * 3}deg)`;
    // tap: notification presses in just before the wipe
    const tap = P(t, 3.2, .25); if (tap > 0) $('#note').style.transform += ` scale(${1 - .04 * Math.sin(tap * Math.PI)})`;
  }
  // S2: chat thread
  if (scene($('#s2'), t, 3.5, 11.0, { x: 540, y: 1300 })) {
    rise($('#head'), t, 3.7, { dy: 80, d: .7 });
    for (let i = 0; i < 5; i++) { const p = P(t, 4.0 + i * .1, .4); $('#sr' + i).style.transform = `scale(${E.back(p)})`; }
    REVIEW.bubbles.forEach((b, i) => {
      const t0 = B0 + i * BGAP, ty = $('#ty' + i), bu = $('#bub' + i);
      const tyIn = P(t, t0 - .55, .3), tyOut = P(t, t0, .15);
      ty.style.opacity = tyIn * (1 - tyOut); ty.style.transform = `scale(${E.back(tyIn) * (1 - .3 * tyOut)})`;
      ty.querySelectorAll('i').forEach((dot, j) => dot.style.transform = `translateY(${-8 * Math.max(0, Math.sin(t * 9 - j * .9))}px)`);
      const p = P(t, t0, .5); bu.style.opacity = cl(p * 3); bu.style.transform = `scale(${E.back(p) * .9 + .1 * cl(p * 3)})`;
      const h = $('#hl' + i); if (h) h.style.backgroundSize = `${E.io(P(t, t0 + .6, .6)) * 100}% 38%`;
    });
    // slow push-in after the last bubble lands
    const z = E.io(P(t, B0 + REVIEW.bubbles.length * BGAP, 1.6));
    $('#thread').style.transform = `scale(${1 + z * .05})`; $('#thread').style.transformOrigin = '0 0';
  }
  // S3: CTA
  if (scene($('#s3'), t, 10.5, 14, { x: 900, y: 1700 })) {
    words($('#t3a'), t, 10.9, { st: .05 });
    words($('#t3'), t, 11.1, { type: 'drop', st: .12, d: .9 });
    words($('#t3b'), t, 12.0, { type: 'blur', st: .04 });
    pop($('#cta'), t, 12.5, { base: 'translateX(-50%)' });
  }
}
</script></body></html>
