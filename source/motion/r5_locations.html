<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css">
<style>
.l64{font-size:64px;font-weight:300}
.n7{font-size:640px;font-weight:700;letter-spacing:-0.04em;line-height:.9}
.m140{font-size:140px;font-weight:600;letter-spacing:-0.02em}
.b190{font-size:190px;font-weight:700;letter-spacing:-0.025em;line-height:1}
#board{position:absolute;left:60px;right:60px;top:430px;background:#fff;border-radius:48px;box-shadow:0 40px 100px rgba(0,0,0,.12);padding:44px 44px 30px;z-index:5}
.bh{display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:600;letter-spacing:.14em;color:#F27C10;padding-bottom:22px;border-bottom:2px solid #1D1D1F}
.bh span{color:#6E6E73;font-weight:500;letter-spacing:.02em}
.cols{display:flex;font-size:20px;font-weight:500;letter-spacing:.12em;color:#6E6E73;padding:20px 0 6px}
.row{display:flex;align-items:center;height:118px;border-bottom:1px solid #E5E5EA}
.row .c{width:120px;font-size:30px;font-weight:500;color:#6E6E73}
.row .d{flex:1;font-size:50px;font-weight:600;letter-spacing:.02em}
.row .s{width:220px;text-align:right}
.st{display:inline-block;background:#F27C10;color:#fff;font-size:22px;font-weight:600;letter-spacing:.1em;padding:12px 22px;border-radius:999px}
</style></head><body>
<section class="sc white" id="s1"><img class="logo" src="a/logo.png">
  <div class="t" style="top:330px" id="t1a" data-text="[l64]Now available in"></div>
  <div class="t" id="n7" style="top:470px;z-index:5"><span class="n7">7</span></div>
  <div class="t" style="top:1080px" id="t1" data-text="[m140]locations."></div>
</section>
<section class="sc white" id="s2" style="background:#F5F5F7"><img class="logo" src="a/logo.png">
  <div class="t lbl" style="top:300px;font-size:44px" id="t2a" data-text="Now boarding, AU and NZ."></div>
  <div id="board">
    <div class="bh">DEPARTURES<span id="clk">9:41</span></div>
    <div class="cols"><div style="width:120px">FLIGHT</div><div style="flex:1">DESTINATION</div><div style="width:220px;text-align:right">STATUS</div></div>
    <div id="rows"></div>
  </div>
</section>
<section class="sc orange" id="s3"><img class="logo" src="a/logo_white.png">
  <div class="t" style="top:520px" id="t3" data-text="[b190]Find your|[b190]local."></div>
  <div class="t lbl" style="top:960px" id="t3b" data-text="Sydney to Christchurch, and everywhere between."></div>
  <div class="pill" id="cta" style="top:1240px">Link in bio.</div>
</section>
<script>window.NO_CIRCLES = true;</script>
<script src="lib.js"></script>
<script>
window.DURATION = 14;
const CITIES = ['SYDNEY','MELBOURNE','BRISBANE','PERTH','CANBERRA','NORTH ISLAND','SOUTH ISLAND'];
const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function setup() {
  circles($('#s1'), [[960,620,300,'#F27C10',.55,60,0],[150,1600,520,'#F5F5F7',.35,80,1],[960,1700,170,'ring:#F27C10',.8,50,2],[130,420,100,'ring:#1D1D1F',1.2,40,3]]);
  circles($('#s2'), [[980,250,220,'ring:#F27C10',.5,40,0],[90,1800,300,'#FFFFFF',.4,40,1],[1000,1800,120,'#F27C10',.9,30,2]]);
  circles($('#s3'), [[880,380,380,'ring:#FFFFFF',.5,60,0],[140,1580,600,'#F58A28',.35,70,1],[960,1620,150,'#FFFFFF',.9,40,2],[120,420,90,'#FFFFFF',1.1,40,3]]);
  $('#rows').innerHTML = CITIES.map((c, i) => `<div class="row" id="row${i}"><div class="c">RW0${i + 1}</div><div class="d" id="dst${i}"></div><div class="s"><span class="st" id="st${i}">NOW OPEN</span></div></div>`).join('');
}
function scramble(word, t, settle, seed) {
  return word.split('').map((ch, j) => {
    if (ch === ' ') return ' ';
    if (t >= settle + j * .045) return ch;
    const f = Math.floor(t * 24); return AZ[(f * 7 + j * 13 + seed * 31 + f * j * 5 + (f * f) % 11) % 26];
  }).join('');
}
function render(t) {
  $$('.sc').forEach(s => moveCircles(s, t));
  if (scene($('#s1'), t, 0, 3.6)) {
    words($('#t1a'), t, .2, { st: .07 });
    const k = E.back(P(t, .5, .9));
    $('#n7').style.transform = `scale(${k}) rotate(${(1 - E.o5(P(t, .5, 1.2))) * -90}deg)`; $('#n7').style.opacity = cl(P(t, .5, .3));
    words($('#t1'), t, 1.2, { type: 'rise' });
  }
  if (scene($('#s2'), t, 3.1, 10.6, { x: 540, y: 1000 })) {
    words($('#t2a'), t, 3.5, { st: .05 });
    rise($('#board'), t, 3.4, { dy: 500, d: 1 });
    $('#board').style.transform += ` rotate(${Math.sin(t * .8) * .6}deg)`;
    CITIES.forEach((c, i) => {
      const start = 4.2 + i * .45, settle = start + .5;
      $('#dst' + i).textContent = t < start ? '' : scramble(c, t, settle, i);
      const s = $('#st' + i), p = P(t, settle + c.length * .045 + .1, .4);
      s.style.opacity = cl(p * 3); s.style.transform = `scale(${E.back(p)})`;
      $('#row' + i).style.background = (t > settle + c.length * .045 && t < settle + c.length * .045 + .35) ? '#FDF1E6' : 'transparent';
    });
  }
  if (scene($('#s3'), t, 10.1, 14, { x: 900, y: 1700 })) {
    words($('#t3'), t, 10.5, { type: 'drop', st: .14, d: .9 });
    words($('#t3b'), t, 11.6, { type: 'blur', st: .04 });
    pop($('#cta'), t, 12.2, { base: 'translateX(-50%)' });
  }
}
</script></body></html>
