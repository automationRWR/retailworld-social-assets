  <div class="ico" id="i1" style="left:75px;top:730px"><svg width="70" height="70" viewBox="0 0 40 40" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9,13 L27,13 L25.5,33 L10.5,33 Z M27,17 C34,17 34,26 26,26"/><path d="M14,5 C13,8 16,8 15,11 M20,5 C19,8 22,8 21,11"/></svg></div>
  <div class="ico" id="i2" style="left:325px;top:730px"><svg width="70" height="70" viewBox="0 0 40 40" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linejoin="round"><path d="M14,21 L26,21 L26,35 L14,35 Z"/><path d="M16,21 L16,9 L24,5 L24,21 Z" fill="#F27C10" stroke="#F27C10"/></svg></div>
  <div class="ico" id="i3" style="left:585px;top:730px"><svg width="74" height="74" viewBox="0 0 40 40" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linejoin="round"><path d="M4,28 L7,13 C12,17 18,17 22,14 L34,23 C38,25 37,30 33,30 L4,30 Z"/><path d="M4,27 H35" stroke="#F27C10"/></svg></div>
  <div class="ico" id="i4" style="left:855px;top:730px"><svg width="70" height="70" viewBox="0 0 40 40" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9,11 L31,11 L31,26 L9,26 Z M4,30 L36,30"/></svg></div>

  <div class="role" id="r3" style="left:545px;top:1560px">Beauty Counter Manager<small>flawless</small></div>

</section>
<section class="sc orange" id="s2"><img class="logo" src="a/logo_white.png">
  <div class="t lbl" style="top:560px;font-size:46px" id="t2a" data-text="Found yours?"></div>
  <div class="t" style="top:680px" id="t2" data-text="[b180]There|[b180]it is."></div>
  <div class="pill" id="cta" style="top:1260px">Comment ROLES</div>
</section>
<script>window.NO_CIRCLES = true;</script>
<script src="lib.js"></script>
<script>
window.DURATION = 13;
function setup() {
  circles($('#s1'), [[960,300,200,'ring:#F27C10',.6,40,0],[110,330,120,'#F27C10',.9,30,1],[980,1800,240,'#F5F5F7',.4,40,2]]);
  circles($('#s2'), [[880,420,380,'ring:#FFFFFF',.5,60,0],[150,1550,560,'#F58A28',.35,70,1],[960,1600,150,'#FFFFFF',.9,40,2],[130,480,90,'#FFFFFF',1.1,40,3]]);
  ['#p1','#p2','#p3','#p4'].forEach(id => { const p = $(id); p._L = p.getTotalLength(); });
}
function render(t) {
  $$('.sc').forEach(s => moveCircles(s, t));
  if (scene($('#s1'), t, 0, 10.4)) {
    words($('#t1a'), t, .2, { st: .06, out: 3.4 });
    words($('#t1'), t, .4, { st: .1, out: 3.5 });
    ['#i1','#i2','#i3','#i4'].forEach((id, i) => pop($(id), t, 1.3 + i * .15));
    ['#p1','#p2','#p3','#p4'].forEach((id, i) => {
      const p = $(id), L = p._L, k = E.io(P(t, 4 + i * .25, 4.2));
      if (id !== '#p3') { p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - k); }
      else { p.style.clipPath = `inset(0 0 ${(1 - k) * 100}% 0)`; }
      p.style.opacity = t < 4 ? 0 : 1;
      const pt = p.getPointAtLength(Math.max(.1, L * k)), dot = $('#dot' + (i + 1));
      dot.style.opacity = t > 4 && k < 1 ? 1 : 0; dot.style.transform = `translate(${pt.x - 20}px, ${pt.y - 20}px)`;
    });
    ['#r1','#r2','#r3','#r4'].forEach((id, i) => pop($(id), t, 7.9 + i * .2));
  }
  if (scene($('#s2'), t, 9.9, 13, { x: 540, y: 1600 })) {
    words($('#t2a'), t, 10.3, { st: .06 });
    words($('#t2'), t, 10.5, { type: 'drop', st: .14, d: .9 });
    pop($('#cta'), t, 11.6, { base: 'translateX(-50%)' });
  }
}
</script></body></html>
