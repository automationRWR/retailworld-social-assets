<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now in seven locations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;src:url(/_blob/b4dad672053bd01e9f0a5880908bc91a) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;src:url(/_blob/4a731a7dca3a3ca607aefd49b2ac7d46) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;src:url(/_blob/faf3f69bf3ab73e90b25a6d2e02a39cd) format('woff2')}
body{margin:0}
</style>
</helmet>
<div style="width: 4320px; height: 675px; display: flex; font-family: 'Poppins', Arial, sans-serif; color: #1D1D1F">
<div style="width: 540px; height: 675px; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; text-align: center; border-right: 1px dashed #E5E5EA">
<img src="/_blob/224e3061193210f17b6c1f6a26e0892e" alt="Retailworld Resourcing" style="position: relative; width: 84px; height: auto; margin-top: 34px">
<div style="position: relative; margin-top: 90px; font-size: 22px; font-weight: 500; color: #F27C10">Now available in</div>
<div style="position: relative; margin-top: 4px; font-size: 220px; font-weight: 600; line-height: 0.9; letter-spacing: -12px">7</div>
<div style="position: relative; font-size: 44px; font-weight: 600; letter-spacing: -2px">locations.</div>
<div style="position: relative; margin-top: auto; margin-bottom: 40px; font-size: 15px; font-weight: 500; line-height: 1.7; max-width: 400px">Sydney · Melbourne · Brisbane · Perth · Canberra · North Island · South Island</div>
</div>
<sc-for list="{{stops}}" as="s" hint-placeholder-count="7">
<div style="width: 540px; height: 675px; position: relative; overflow: hidden; box-sizing: border-box; padding: 34px 44px 40px; background: {{s.bg}}; color: {{s.fg}}; display: flex; flex-direction: column; border-right: 1px dashed #E5E5EA">
<img src="{{s.logo}}" alt="Retailworld Resourcing" style="position: relative; align-self: center; width: 84px; height: auto; visibility: {{s.lv}}">
<div style="position: relative; margin-top: 70px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 500"><span style="color: {{s.accent}}">Now open</span><span style="color: {{s.muted}}">{{s.num}}</span></div>
<div style="position: relative; margin-top: 6px; font-size: {{s.size}}; font-weight: 600; line-height: 0.95; letter-spacing: -4px">{{s.city}}</div>
<div style="position: relative; margin-top: 18px; font-size: 19px; font-weight: 400; line-height: 1.45; max-width: 400px">{{s.line}}</div>
<div style="position: relative; margin-top: auto; display: flex; align-items: stretch; gap: 14px">
<div style="width: 130px; flex-shrink: 0; border-radius: 26px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 500; color: #AEAEB2; padding: 10px; box-sizing: border-box">[ TEAM PHOTO ]</div>
<div style="flex-grow: 1; background: #FFFFFF; color: #1D1D1F; border: 1px solid #E5E5EA; border-radius: 26px; padding: 18px 20px; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 13px; font-weight: 400; color: #6E6E73">{{s.address}}</span>
<span style="font-size: 15px; font-weight: 600">{{s.email}}</span>
<span style="font-size: 13px; font-weight: 500; color: #F27C10; margin-top: 4px">Jobs in {{s.short}}, link in bio</span>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4320,"height":675}}'>
class Component extends DCLogic {
renderVals() {
var d = [
['Sydney', 'Level 7 on Market Street. Close enough to Pitt Street Mall to judge every window display.', 'Level 7, 44 Market Street', 'sydney@rwr.net.au', 'Sydney'],
['Melbourne', 'The Collins Street crew. We find the role. You pick the laneway coffee.', 'Level 5, 447 Collins Street', 'melbourne@rwr.net.au', 'Melbourne'],
['Brisbane', 'Queen Street locals. Sunshine State, sunnier rosters.', '260 Queen Street, Brisbane City', 'brisbane@rwr.net.au', 'Brisbane'],
['Perth', 'St Georges Terrace. Last to clock off, thanks to the time zone.', '191 St Georges Terrace', 'perth@rwr.net.au', 'Perth'],
['Canberra', 'Small city. Big retail energy. Yes, there are shops in Canberra.', 'Canberra ACT 2601', 'canberra@rwr.net.au', 'Canberra'],
['North Island', 'Kia ora from Albert Street, Auckland. Cape Reinga to Wellington, we know who is hiring.', 'Level 9, 87 Albert Street, Auckland', 'auckland@rwr.co.nz', 'the North Island'],
['South Island', 'St Asaph Street, Christchurch. Everything south of Cook Strait is our patch.', '7/204 St Asaph Street, Christchurch', 'southisland@rwr.co.nz', 'the South Island']
];
return { stops: d.map(function (x, i) {
return { city: x[0], line: x[1], address: x[2], email: x[3], short: x[4],
num: (i + 1) + ' of 7', lv: i === 6 ? 'visible' : 'hidden', bg: i % 2 === 0 ? '#FFFFFF' : '#F27C10', fg: i % 2 === 0 ? '#1D1D1F' : '#FFFFFF', accent: i % 2 === 0 ? '#F27C10' : '#FFFFFF', muted: i % 2 === 0 ? '#6E6E73' : '#FFFFFF', logo: i % 2 === 0 ? '/_blob/224e3061193210f17b6c1f6a26e0892e' : '/_blob/cf3136879b228d16e56fbb0a06d0b5df',
glowX: (i % 2 === 0 ? 120 : -260) + 'px',
size: x[0].length > 9 ? '64px' : '84px' };
}) };
}
}
</script>
</body>
</html>
